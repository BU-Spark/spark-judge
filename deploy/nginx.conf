server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud https://*.convex.site https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; form-action 'self' https://*.convex.site https://accounts.google.com; upgrade-insecure-requests" always;
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
